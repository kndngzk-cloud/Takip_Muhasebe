<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Güvenli Ödeme</title>
  <meta name="theme-color" content="#0f1b33">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-v4.png">
  <style>
    :root {
      --bg:#eef1f6; --kart:#fff; --yazi:#0f1b33; --yazi2:#55607a; --yazi3:#8a93a8; --cizgi:#e2e6ee; --zemin2:#f6f8fb;
      --lacivert:#0f1b33; --lacivert2:#1c2d52; --vurgu:#2457d6; --yesil:#0b8a57; --yesil2:#e5f5ee; --kirmizi:#c93434; --altin:#c8a45a;
    }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body { margin:0; background:var(--bg); color:var(--yazi); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .ust { background:linear-gradient(135deg, var(--lacivert) 0%, var(--lacivert2) 100%); color:#fff; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 70px; }
    .ust-ic { max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .marka { display:flex; align-items:center; gap:12px; min-width:0; }
    .amblem { flex:none; width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-weight:800; font-size:17px; letter-spacing:.02em;
      background:rgba(255,255,255,.1); border:1px solid rgba(200,164,90,.55); color:var(--altin); }
    .marka b { display:block; font-size:17px; font-weight:750; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .marka small { display:block; font-size:12.5px; color:#b9c3da; }
    .rozet { flex:none; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:650; color:#d9f3e7; background:rgba(11,138,87,.22); border:1px solid rgba(80,200,150,.35); padding:6px 10px; border-radius:999px; }
    .rozet svg { width:14px; height:14px; }
    .adimlar { max-width:560px; margin:22px auto 0; display:flex; gap:8px; }
    .adim { flex:1; font-size:12px; color:#9fabc6; display:flex; align-items:center; gap:6px; min-width:0; }
    .adim i { flex:none; font-style:normal; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; border:1px solid rgba(255,255,255,.25); }
    .adim span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .adim.on { color:#fff; font-weight:650; } .adim.on i { background:#fff; color:var(--lacivert); border-color:#fff; }
    main { max-width:560px; margin:-48px auto 0; padding:0 16px 28px; }
    .kart { background:var(--kart); border-radius:18px; box-shadow:0 1px 2px rgba(15,27,51,.06), 0 10px 30px rgba(15,27,51,.08); overflow:hidden; }
    .bolum { padding:20px; }
    .bolum + .bolum { border-top:1px solid var(--cizgi); }
    .etiket { font-size:12px; color:var(--yazi3); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    .unvan { font-size:18px; font-weight:700; margin-top:2px; overflow-wrap:anywhere; }
    .bakiye { margin-top:14px; display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:12px 14px; border-radius:12px; background:var(--zemin2); border:1px solid var(--cizgi); }
    .bakiye span { font-size:14px; color:var(--yazi2); }
    .bakiye b { font-size:19px; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .not { margin-top:12px; font-size:14px; color:var(--yazi2); white-space:pre-line; padding-left:10px; border-left:3px solid var(--altin); }
    label.b { display:block; font-weight:700; margin:0 0 8px; }
    .tutar { position:relative; }
    .tutar input { width:100%; font:inherit; font-size:28px; font-weight:750; padding:14px 56px 14px 16px; border:1.5px solid var(--cizgi); border-radius:14px; background:var(--zemin2); color:var(--yazi); font-variant-numeric:tabular-nums; transition:border-color .15s, background .15s; }
    .tutar input:focus { outline:none; border-color:var(--vurgu); background:#fff; box-shadow:0 0 0 4px rgba(36,87,214,.1); }
    .tutar span { position:absolute; right:18px; top:50%; transform:translateY(-50%); font-size:20px; font-weight:700; color:var(--yazi3); }
    .hizli { margin-top:10px; }
    .hizli button { font:inherit; font-size:14px; padding:7px 12px; border-radius:999px; border:1px solid var(--cizgi); background:#fff; color:var(--vurgu); font-weight:600; cursor:pointer; }
    .secenekler { display:grid; gap:8px; }
    .secenek { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1.5px solid var(--cizgi); border-radius:12px; cursor:pointer; transition:border-color .15s, background .15s; }
    .secenek input { accent-color:var(--vurgu); width:18px; height:18px; margin:0; flex:none; }
    .secenek .a { flex:1; min-width:0; } .secenek .a b { display:block; font-size:15px; } .secenek .a small { color:var(--yazi2); font-size:13px; }
    .secenek .t { font-weight:750; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .secenek:has(input:checked) { border-color:var(--vurgu); background:rgba(36,87,214,.05); }
    .bilgi { font-size:14px; color:var(--yazi2); display:flex; gap:8px; align-items:flex-start; }
    .bilgi svg { flex:none; width:18px; height:18px; margin-top:2px; color:var(--yesil); }
    .ozet { display:grid; gap:6px; font-size:15px; }
    .ozet div { display:flex; justify-content:space-between; gap:12px; } .ozet div span:last-child { font-variant-numeric:tabular-nums; white-space:nowrap; }
    .ozet .top { border-top:1px dashed var(--cizgi); padding-top:10px; margin-top:4px; font-weight:800; font-size:18px; }
    .ozet .sil { color:var(--yazi2); }
    .ode { margin-top:16px; width:100%; display:flex; align-items:center; justify-content:center; gap:10px; font:inherit; font-size:18px; font-weight:750; padding:16px; border:0; border-radius:14px; background:var(--yesil); color:#fff; cursor:pointer; box-shadow:0 6px 16px rgba(11,138,87,.25); }
    .ode svg { width:20px; height:20px; }
    .ode:disabled { opacity:.6; cursor:default; box-shadow:none; }
    .hata { margin-top:12px; color:var(--kirmizi); font-weight:600; font-size:15px; }
    .yonlen { margin-top:10px; font-size:13px; color:var(--yazi3); text-align:center; }
    .guven { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:16px; }
    .guven div { background:var(--kart); border-radius:14px; padding:12px 8px; text-align:center; font-size:12px; color:var(--yazi2); line-height:1.35; box-shadow:0 1px 2px rgba(15,27,51,.05); }
    .guven svg { display:block; margin:0 auto 6px; width:22px; height:22px; color:var(--lacivert2); }
    .guven b { display:block; color:var(--yazi); font-size:12.5px; }
    footer { max-width:560px; margin:0 auto; padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px)); text-align:center; font-size:13px; color:var(--yazi3); }
    footer b { color:var(--yazi2); }
    footer a { color:var(--yazi2); text-decoration:none; }
    footer .il { margin-top:4px; display:flex; flex-wrap:wrap; justify-content:center; gap:4px 14px; }
    .bos { text-align:center; padding:36px 20px; color:var(--yazi2); }
    .bos svg { width:36px; height:36px; color:var(--yazi3); display:block; margin:0 auto 10px; }
    @media (max-width:380px) { .adim span { display:none; } .adim { justify-content:center; } .guven div { font-size:11px; } }
  </style>
</head>
<body>
  <div class="ust">
    <div class="ust-ic">
      <div class="marka"><div class="amblem" id="amblem">₺</div><div><b id="firma">Cari Hesap Ödemesi</b><small>Cari hesap ödeme sayfası</small></div></div>
      <span class="rozet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Güvenli ödeme</span>
    </div>
    <div class="adimlar"><div class="adim on"><i>1</i><span>Tutar</span></div><div class="adim"><i>2</i><span>Kart bilgileri</span></div><div class="adim"><i>3</i><span>Onay</span></div></div>
  </div>
  <main>
    <div class="kart" id="icerik"><div class="bos">Yükleniyor…</div></div>
    <div class="guven">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><b>SSL şifreli</b>güvenli bağlantı</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg><b>Kart bilgileriniz</b>firmaya iletilmez</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg><b>PayTR altyapısı</b>lisanslı ödeme kuruluşu</div>
    </div>
  </main>
  <footer id="alt"></footer>
  <script src="config.js"></script>
  <script src="odeme.js"></script>
</body>
</html>
