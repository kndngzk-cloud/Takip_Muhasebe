<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gider Gir">
  <meta name="theme-color" content="#0f1b33">
  <title>Gider Girişi</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32-v4.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-v4.png">
  <style>
    :root { --bg:#eef1f6; --kart:#fff; --yazi:#0f1b33; --yazi2:#55607a; --yazi3:#8a93a8; --cizgi:#e2e6ee; --zemin2:#f6f8fb; --lacivert:#0f1b33; --lacivert2:#1c2d52; --vurgu:#2457d6; --yesil:#0b8a57; --yesil2:#e5f5ee; --kirmizi:#c93434; --turuncu:#d9670b; }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body { margin:0; background:var(--bg); color:var(--yazi); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .ust { background:linear-gradient(135deg, var(--lacivert) 0%, var(--lacivert2) 100%); color:#fff; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 56px; }
    .ust-ic { max-width:560px; margin:0 auto; display:flex; align-items:center; gap:12px; }
    .amblem { flex:none; width:46px; height:46px; border-radius:12px; display:grid; place-items:center; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.25); }
    .amblem img { width:34px; height:34px; object-fit:contain; display:block; }
    .ust b { display:block; font-size:17px; font-weight:750; }
    .ust small { display:block; font-size:13px; color:#b9c3da; }
    main { max-width:560px; margin:-40px auto 0; padding:0 16px calc(28px + env(safe-area-inset-bottom,0px)); }
    .kart { background:var(--kart); border-radius:18px; box-shadow:0 1px 2px rgba(15,27,51,.06), 0 10px 30px rgba(15,27,51,.08); padding:18px; }
    label.b { display:block; font-weight:700; margin:16px 0 8px; font-size:15px; }
    label.b:first-child { margin-top:0; }
    .tutar { position:relative; }
    .tutar input { width:100%; font:inherit; font-size:28px; font-weight:750; padding:12px 52px 12px 14px; border:1.5px solid var(--cizgi); border-radius:14px; background:var(--zemin2); color:var(--yazi); font-variant-numeric:tabular-nums; }
    .tutar span { position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:20px; font-weight:700; color:var(--yazi3); }
    input.in, select.in { width:100%; font:inherit; padding:12px 14px; border:1.5px solid var(--cizgi); border-radius:12px; background:var(--zemin2); color:var(--yazi); }
    input:focus, select:focus { outline:none; border-color:var(--vurgu); background:#fff; }
    .kats { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
    .kats button, .seg button { font:inherit; font-size:14px; font-weight:600; padding:10px 8px; border-radius:12px; border:1.5px solid var(--cizgi); background:#fff; color:var(--yazi2); cursor:pointer; }
    .kats button.on, .seg button.on { border-color:var(--vurgu); background:rgba(36,87,214,.07); color:var(--vurgu); }
    .seg { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; }
    .seg button { font-size:13px; padding:9px 4px; }
    .chk { display:flex; align-items:center; gap:10px; margin-top:14px; font-size:15px; }
    .chk input { width:20px; height:20px; accent-color:var(--vurgu); }
    .kaydet { margin-top:18px; width:100%; font:inherit; font-size:18px; font-weight:750; padding:15px; border:0; border-radius:14px; background:var(--yesil); color:#fff; cursor:pointer; box-shadow:0 6px 16px rgba(11,138,87,.25); }
    .kaydet:disabled { opacity:.6; }
    .hata { margin-top:10px; color:var(--kirmizi); font-weight:600; }
    .ok { margin-top:10px; color:var(--yesil); font-weight:700; }
    h3 { margin:22px 4px 8px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--yazi3); }
    .liste { background:var(--kart); border-radius:16px; overflow:hidden; box-shadow:0 1px 2px rgba(15,27,51,.05); }
    .sat { display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:1px solid var(--cizgi); }
    .sat:first-child { border-top:0; }
    .sat .a { flex:1; min-width:0; } .sat .a b { display:block; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .sat .a small { color:var(--yazi2); font-size:13px; }
    .sat .t { font-weight:750; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .sat button { font:inherit; font-size:12px; padding:5px 9px; border-radius:8px; border:1px solid var(--cizgi); background:#fff; color:var(--kirmizi); cursor:pointer; }
    .bos { text-align:center; padding:30px 16px; color:var(--yazi2); }
    .not { margin:16px 4px 0; font-size:12.5px; color:var(--yazi3); text-align:center; }
  </style>
</head>
<body>
  <div class="ust"><div class="ust-ic"><div class="amblem"><img src="icons/lama.png" alt=""></div><div><b id="firma">Gider Girişi</b><small id="kim">Gider girişi</small></div></div></div>
  <main>
    <div class="kart" id="icerik"><div class="bos">Yükleniyor…</div></div>
    <div id="gecmis"></div>
    <p class="not">Girdiğiniz giderler doğrudan firmanın gider defterine işlenir. Yanlış girişi 24 saat içinde buradan silebilirsiniz.</p>
  </main>
  <script src="config.js"></script>
  <script src="gider.js"></script>
</body>
</html>
