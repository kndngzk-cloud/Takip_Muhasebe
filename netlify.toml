[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.txt"
  [headers.values]
    Cache-Control = "no-cache"

# Yalnizca kendi dosyalarimiz calisir (satir ici script yok). Yan etkisi: Netlify'in
# "Powered by Netlify" rozeti (satir ici script ister) da gorunmez.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "script-src 'self'; object-src 'none'; base-uri 'self'"

# Musteri odeme sayfasi kisa adresi: /odeme#<token>
[[redirects]]
  from = "/odeme"
  to = "/odeme.html"
  status = 200

# Kisiye ozel gider giris sayfasi: /gider#<token>
[[redirects]]
  from = "/gider"
  to = "/gider.html"
  status = 200

# Gider programi (sadece gider girilen ayri uygulama): /harcama
[[redirects]]
  from = "/harcama"
  to = "/harcama.html"
  status = 200

# B2B bayi portali (musteri kullanicilari): /bayi
[[redirects]]
  from = "/bayi"
  to = "/bayi.html"
  status = 200
